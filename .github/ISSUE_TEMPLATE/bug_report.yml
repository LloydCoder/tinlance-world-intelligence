name: Bug report
description: Report a reproducible defect in the repository.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a reproducible problem. Do not include credentials or private production data.
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Provide the commit SHA or release that exhibits the issue.
      placeholder: "bf769f6"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.x"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, PostgreSQL/PostGIS version if relevant, and runtime mode.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest reliable sequence of commands or API calls.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      description: Remove secrets, tokens, private URLs, and sensitive data before posting.
      render: text
