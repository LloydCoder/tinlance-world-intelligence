name: Feature request
description: Propose a capability that belongs in World Intelligence.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Explain the problem first. Features should preserve the repository's provenance, temporal, security, and ecosystem boundaries.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should users be able to do after the change?
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Architectural boundary
      description: Why does this belong here rather than ReconOS, TADS, Agent OS, or Agent Platform?
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Proposed design
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
