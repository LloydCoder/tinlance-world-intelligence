name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    name: Repository foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall packages services api tests

      - name: Run repository tests
        run: python -m unittest discover -s tests -v

      - name: Verify required documentation
        run: |
          test -s README.md
          test -s CONTRIBUTING.md
          test -s SECURITY.md
          test -s LICENSE
