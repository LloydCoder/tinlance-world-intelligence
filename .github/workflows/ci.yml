name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python contracts and security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall packages services api tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run repository security baseline
        run: python scripts/security_baseline.py

  database:
    name: PostgreSQL/PostGIS migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5@sha256:7ef699637304feff96028edbc7a653e135f2db2236d322b5cb2bfca11fd920bc
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: world_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply foundation migration
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d world_intelligence -v ON_ERROR_STOP=1 -f db/migrations/0001_foundation_source_artifact.sql
      - name: Verify schema
        env:
          PGPASSWORD: postgres
        run: |
          test "$(psql -h 127.0.0.1 -U postgres -d world_intelligence -Atc "SELECT count(*) FROM pg_extension WHERE extname='postgis';")" = "1"
          test "$(psql -h 127.0.0.1 -U postgres -d world_intelligence -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='world_intelligence';")" = "5"
