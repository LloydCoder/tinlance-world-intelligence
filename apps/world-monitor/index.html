<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tinlance World Monitor</title><link rel="stylesheet" href="styles.css"></head><body><header><strong>Tinlance World Monitor</strong><nav><button data-view="map">Map</button><button data-view="events">Events</button><button data-view="entities">Entities</button><button data-view="timeline">Timeline</button><button data-view="changes">Changes</button><button data-view="signals">Signals</button><button data-view="evidence">Evidence</button><button data-view="provenance">Provenance</button></nav></header><main><section id="map" class="view active"><h1>World map</h1><svg id="world-map" viewBox="0 0 1000 500" role="img" aria-label="World intelligence map"><rect width="1000" height="500"/><g id="markers"></g></svg></section><section id="events" class="view"><h1>Event stream</h1><div id="event-list"></div></section><section id="entities" class="view"><h1>Entity explorer</h1><div id="entity-list"></div></section><section id="timeline" class="view"><h1>Timeline</h1><input id="timeline-range" type="range" min="0" max="100" value="100"></section><section id="changes" class="view"><h1>Changes</h1><div id="change-list"></div></section><section id="signals" class="view"><h1>Signals</h1><div id="signal-list"></div></section><section id="evidence" class="view"><h1>Evidence inspector</h1><pre id="evidence-view"></pre></section><section id="provenance" class="view"><h1>Provenance</h1><pre id="provenance-view"></pre></section></main><script src="app.js"></script></body></html>
